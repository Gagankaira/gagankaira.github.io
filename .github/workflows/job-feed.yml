name: Refresh Azure Data Engineer Job Feed

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-feed.yml'
      - 'jobs/index.html'
      - 'data/jobs.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect public job feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          UA = 'GaganKaira-AzureJobs/1.1 (+https://gagankaira.github.io/jobs/)'
          tags = [
              'Azure Data Engineer', 'Senior Azure Data Engineer', 'Data Engineer',
              'Azure Databricks', 'Databricks', 'Azure Data Factory', 'Azure Synapse',
              'PySpark', 'Spark Data Engineer', 'Data Platform Engineer', 'Big Data Engineer'
          ]
          azure_signal = re.compile(
              r'azure|microsoft azure|azure data factory|\badf\b|azure databricks|\bdatabricks\b|azure synapse|\bsynapse\b|\badls\b|azure data lake|microsoft fabric',
              re.I,
          )
          data_role = re.compile(
              r'data engineer|data engineering|data platform|data pipeline|big data|analytics engineer|etl',
              re.I,
          )
          aws_only_title = re.compile(r'\baws\b|amazon web services', re.I)
          azure_title = re.compile(r'azure|adf|databricks|synapse|adls|microsoft fabric', re.I)

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8', errors='replace'))

          def norm(raw, source):
              title = raw.get('jobTitle') or raw.get('title') or raw.get('position') or raw.get('name') or 'Data Engineer'
              company = raw.get('companyName') or raw.get('company_name') or raw.get('company') or 'Company not specified'
              url = raw.get('url') or raw.get('apply_url') or raw.get('applyUrl') or raw.get('link') or ''
              date = raw.get('pubDate') or raw.get('publication_date') or raw.get('date') or raw.get('publishDate') or raw.get('created_at') or ''
              location = raw.get('jobGeo') or raw.get('candidate_required_location') or raw.get('location') or 'Remote'
              description = raw.get('jobDescription') or raw.get('description') or raw.get('jobExcerpt') or raw.get('excerpt') or ''
              job_id = str(raw.get('id') or raw.get('jobSlug') or raw.get('slug') or raw.get('guid') or url)
              tags = raw.get('tags') or []
              if not isinstance(tags, list):
                  tags = [str(tags)]
              return {'id':job_id,'title':title,'company':company,'location':location,'date':date,'url':url,'description':description,'tags':tags,'source':source}

          def azure_match(j):
              hay = ' '.join([j['title'], j['company'], j['location'], j['description'], ' '.join(j['tags'])])
              title = j['title']
              # Keep Azure/multi-cloud data roles, but reject AWS-only job titles.
              if not data_role.search(hay) or not azure_signal.search(hay):
                  return False
              if aws_only_title.search(title) and not azure_title.search(title):
                  return False
              return True

          jobs = []
          errors = []

          for tag in tags:
              try:
                  q = urllib.parse.urlencode({'count': 200, 'tag': tag})
                  payload = get('https://jobicy.com/api/v2/remote-jobs?' + q)
                  for raw in payload.get('jobs', []):
                      j = norm(raw, 'Jobicy')
                      if azure_match(j): jobs.append(j)
              except Exception as exc:
                  errors.append('Jobicy:' + tag + ':' + str(exc))

          try:
              payload = get('https://remotive.com/api/remote-jobs?limit=200')
              for raw in payload.get('jobs', []):
                  j = norm(raw, 'Remotive')
                  if azure_match(j): jobs.append(j)
          except Exception as exc:
              errors.append('Remotive:' + str(exc))

          try:
              payload = get('https://remoteok.com/api')
              for raw in payload if isinstance(payload, list) else []:
                  if not raw.get('position'): continue
                  j = norm(raw, 'Remote OK')
                  if azure_match(j): jobs.append(j)
          except Exception as exc:
              errors.append('Remote OK:' + str(exc))

          try:
              payload = get('https://www.arbeitnow.com/api/job-board-api')
              rows = payload if isinstance(payload, list) else payload.get('data') or payload.get('jobs') or []
              for raw in rows:
                  raw = {'id':raw.get('slug') or raw.get('id'),'title':raw.get('title'),'company_name':raw.get('company_name') or raw.get('company'),'location':raw.get('location') or 'Remote','url':raw.get('url'),'date':raw.get('created_at') or raw.get('date'),'description':raw.get('description'),'tags':raw.get('tags') or []}
                  j = norm(raw, 'Arbeitnow')
                  if azure_match(j): jobs.append(j)
          except Exception as exc:
              errors.append('Arbeitnow:' + str(exc))

          # Intentionally DO NOT deduplicate. Multiple source records are separate application paths.
          output = {'generated_at':datetime.now(timezone.utc).isoformat(),'record_count':len(jobs),'sources_attempted':['Jobicy','Remotive','Remote OK','Arbeitnow'],'errors':errors,'jobs':jobs}
          with open('data/jobs.json','w',encoding='utf-8') as f:
              json.dump(output,f,ensure_ascii=False,separators=(',',':'))
          PY

      - name: Publish refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh Azure data engineer job feed'
          git push
